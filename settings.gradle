pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Agent-0"
include(":app")

try {
    def runnerSdk = new File("/usr/local/lib/android/sdk")
    if (new File(runnerSdk, "platforms/android-34").isDirectory()) {
        new File(rootDir, "local.properties").text = "sdk.dir=/usr/local/lib/android/sdk\n"
    }
} catch (Exception ignored) {
}
